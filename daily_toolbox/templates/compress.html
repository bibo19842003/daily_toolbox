{% extends "base.html" %}

{% block title %}图片压缩{% endblock %}

{% block content %}
  <style>
    .dropzone { border: 2px dashed #c7d2fe; border-radius: .75rem; background: #fafbff;
                transition: all .15s ease; cursor: pointer; }
    .dropzone:hover, .dropzone.drag { border-color: #7c3aed; background: #f5f3ff; }
    .thumb { width: 84px; height: 64px; object-fit: cover; border-radius: .375rem;
             border: 1px solid #e5e7eb; background: #f8fafc; }
    .ratio-badge { font-size: .75rem; }
    .btn-ghost-mini { border: 0; background: transparent; color: #94a3b8;
                      padding: .15rem .4rem; border-radius: .375rem; }
    .btn-ghost-mini:hover { color: #7c3aed; background: rgba(124, 58, 237, .10); }
  </style>

  <div class="page-header">
    <h4 class="page-title"><i class="bi bi-images me-2"></i>图片压缩</h4>
    <p class="page-subtitle">在浏览器本地压缩图片（质量 / 缩小尺寸 / 转格式），不会上传任何数据</p>
  </div>

  <div class="card stat-card mb-4">
    <div class="card-body">
      <div id="dropZone" class="dropzone text-center py-5">
        <i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
        <p class="mb-1 fw-semibold">点击选择 或 拖拽图片到此处</p>
        <p class="text-secondary small mb-0">支持 PNG / JPEG / WebP / BMP / GIF（静态帧），可多选</p>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>

      <div class="row g-3 mt-1 align-items-end">
        <div class="col-md-3">
          <label class="form-label small fw-semibold mb-1">输出格式</label>
          <select class="form-select" id="fmtSel">
            <option value="auto" selected>保持原格式*</option>
            <option value="image/jpeg">JPEG（有损，体积最小）</option>
            <option value="image/webp">WebP（有损，性价比高）</option>
            <option value="image/png">PNG（无损，质量滑块不生效）</option>
          </select>
          <div class="form-text mb-0">* GIF/BMP 等浏览器无法原样编码的格式会自动按 JPEG 输出</div>
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-semibold mb-1 d-flex justify-content-between">
            <span>压缩质量</span><span class="text-primary" id="qVal">75%</span>
          </label>
          <input type="range" class="form-range" id="qRange" min="10" max="100" step="5" value="75">
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-semibold mb-1">最大宽度（超宽缩小）</label>
          <select class="form-select" id="maxWSel">
            <option value="0" selected>保持原始尺寸</option>
            <option value="3840">3840 px（4K）</option>
            <option value="1920">1920 px（全高清）</option>
            <option value="1280">1280 px</option>
            <option value="800">800 px</option>
          </select>
        </div>
        <div class="col-md-3 d-grid">
          <button class="btn btn-primary" id="goBtn" disabled>
            <i class="bi bi-magic me-1"></i>开始压缩
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="results"></div>
{% endblock %}

{% block extra_js %}
  <script>
    (function () {
      var files = [];           // { file, url }
      var zone = document.getElementById('dropZone');
      var input = document.getElementById('fileInput');
      var goBtn = document.getElementById('goBtn');
      var qRange = document.getElementById('qRange');
      var qVal = document.getElementById('qVal');
      var fmtSel = document.getElementById('fmtSel');
      var maxWSel = document.getElementById('maxWSel');
      var results = document.getElementById('results');

      function fmtSize(n) {
        if (n < 1024) { return n + ' B'; }
        if (n < 1024 * 1024) { return (n / 1024).toFixed(1) + ' KB'; }
        return (n / 1024 / 1024).toFixed(2) + ' MB';
      }
      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function extOf(mime) {
        return { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[mime] || 'jpg';
      }

      qRange.addEventListener('input', function () { qVal.textContent = qRange.value + '%'; });

      zone.addEventListener('click', function () { input.click(); });
      input.addEventListener('change', function () { addFiles(input.files); input.value = ''; });
      ['dragenter', 'dragover'].forEach(function (ev) {
        zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.add('drag'); });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.remove('drag'); });
      });
      zone.addEventListener('drop', function (e) { addFiles(e.dataTransfer.files); });

      function addFiles(list) {
        Array.prototype.forEach.call(list, function (f) {
          if (!f.type.startsWith('image/')) { return; }
          files.push({ file: f, url: URL.createObjectURL(f) });
        });
        goBtn.disabled = files.length === 0;
        if (files.length) {
          results.innerHTML = '<div class="alert alert-secondary py-2 small mb-3"><i class="bi bi-check2-circle me-1"></i>已选择 ' +
            files.length + ' 张图片，设置参数后点击「开始压缩」</div>';
        }
      }

      function targetMime(fileType) {
        var v = fmtSel.value;
        if (v !== 'auto') { return v; }
        return (fileType === 'image/png' || fileType === 'image/webp') ? fileType : 'image/jpeg';
      }

      function loadImage(url) {
        return new Promise(function (resolve, reject) {
          var img = new Image();
          img.onload = function () { resolve(img); };
          img.onerror = reject;
          img.src = url;
        });
      }

      async function compressOne(item) {
        var img = await loadImage(item.url);
        var maxW = +maxWSel.value;
        var scale = (maxW > 0 && img.naturalWidth > maxW) ? maxW / img.naturalWidth : 1;
        var w = Math.max(1, Math.round(img.naturalWidth * scale));
        var h = Math.max(1, Math.round(img.naturalHeight * scale));

        var mime = targetMime(item.file.type);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        if (mime === 'image/jpeg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); }
        ctx.drawImage(img, 0, 0, w, h);

        var q = +qRange.value / 100;
        var blob = await new Promise(function (resolve) {
          canvas.toBlob(resolve, mime, mime === 'image/png' ? undefined : q);
        });
        return { blob: blob, sw: img.naturalWidth, sh: img.naturalHeight, w: w, h: h };
      }

      goBtn.addEventListener('click', async function () {
        if (!files.length) { return; }
        goBtn.disabled = true;
        goBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>压缩中…';
        var out = [];
        for (var i = 0; i < files.length; i++) {
          try {
            var res = await compressOne(files[i]);
            var name = files[i].file.name.replace(/\.[^.]+$/, '') + '_compressed.' + extOf(res.blob.type);
            out.push({ name: name, blob: res.blob, url: URL.createObjectURL(res.blob),
                       origin: files[i].file, sw: res.sw, sh: res.sh, w: res.w, h: res.h });
          } catch (e) {
            out.push({ name: files[i].file.name, error: true });
          }
        }
        renderResults(out);
        goBtn.disabled = false;
        goBtn.innerHTML = '<i class="bi bi-magic me-1"></i>开始压缩';
      });

      function renderResults(list) {
        var rows = list.map(function (r, i) {
          if (r.error) {
            return '<div class="d-flex align-items-center gap-3 py-2 border-bottom">' +
              '<i class="bi bi-x-circle text-danger"></i>' +
              '<span class="text-danger small">无法解码：' + esc(r.name) + '</span></div>';
          }
          var d = r.origin.size - r.blob.size;
          var pct = r.origin.size ? Math.round(d * 100 / r.origin.size) : 0;
          var badge = d > 0
            ? '<span class="badge ratio-badge bg-success-subtle text-success">-' + pct + '%</span>'
            : (d < 0
              ? '<span class="badge ratio-badge bg-warning-subtle text-warning">+' + (-pct) + '%</span>'
              : '<span class="badge ratio-badge bg-secondary-subtle text-secondary">±0%</span>');
          return '<div class="d-flex align-items-center gap-3 py-2 border-bottom flex-wrap">' +
            '<img class="thumb" src="' + r.url + '">' +
            '<div><div class="fw-semibold small">' + esc(r.name) + '</div>' +
            '<div class="text-secondary" style="font-size:.8rem">' + fmtSize(r.origin.size) +
            ' → <b class="text-body">' + fmtSize(r.blob.size) + '</b> ' + badge +
            ' <span class="ms-1 text-secondary">' + r.sw + '×' + r.sh +
            ' → ' + r.w + '×' + r.h + '</span></div></div>' +
            '<span class="ms-auto d-flex gap-2">' +
            '<button class="btn btn-sm btn-outline-primary" data-dl="' + i + '">' +
            '<i class="bi bi-download"></i> 下载</button></span></div>';
        }).join('');
        var allBtn = list.some(function (r) { return !r.error; })
          ? '<div class="text-end mt-3"><button class="btn btn-outline-secondary" id="dlAll">' +
            '<i class="bi bi-download me-1"></i>逐个下载全部（' + list.filter(function (r) { return !r.error; }).length + ' 张）</button></div>'
          : '';
        results.innerHTML = rows + allBtn;

        list.forEach(function (r, i) {
          if (r.error) { return; }
          var b = results.querySelector('button[data-dl="' + i + '"]');
          if (b) {
            b.addEventListener('click', function () { download(r); });
          }
        });
        var da = document.getElementById('dlAll');
        if (da) {
          da.addEventListener('click', function () {
            list.forEach(function (r) { if (!r.error) { download(r); } });
          });
        }
      }

      function download(r) {
        var a = document.createElement('a');
        a.href = r.url;
        a.download = r.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
    })();
  </script>
{% endblock %}
