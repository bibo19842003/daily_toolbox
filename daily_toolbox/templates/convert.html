{% extends "base.html" %}

{% block title %}格式转换{% endblock %}

{% block content %}
  <div class="mb-4">
    <h1 class="page-title">图片格式转换</h1>
    <p class="page-subtitle">PNG / JPEG / WebP / BMP 互转，支持 ICO 多尺寸图标（favicon），纯本地处理不上传</p>
  </div>

  <div class="row g-4">
    <!-- 上传区 -->
    <div class="col-12">
      <div class="card stat-card" id="dropZone" style="border-style:dashed;border-width:2px;cursor:pointer">
        <div class="card-body text-center py-5">
          <i class="bi bi-cloud-arrow-up fs-1 d-block text-secondary mb-2"></i>
          <div class="fw-semibold">点击选择图片，或拖拽到此处</div>
          <div class="text-secondary small mt-1">支持多选，格式：PNG / JPEG / WebP / BMP / GIF（首帧）</div>
          <input type="file" class="d-none" id="fileInput" accept="image/*" multiple>
        </div>
      </div>
    </div>

    <!-- 转换设置 -->
    <div class="col-12">
      <div class="card stat-card">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-auto">
              <label class="form-label small fw-semibold mb-1">目标格式</label>
              <select class="form-select" id="fmtSelect" style="width:140px">
                <option value="png">PNG</option>
                <option value="jpeg" selected>JPEG</option>
                <option value="webp">WebP</option>
                <option value="bmp">BMP</option>
                <option value="ico">ICO（图标）</option>
              </select>
            </div>
            <div class="col-auto" id="qualityWrap">
              <label class="form-label small fw-semibold mb-1">质量 <span class="text-secondary" id="qualityVal">90%</span></label>
              <input type="range" class="form-range" id="qualityRange" min="10" max="100" step="5" value="90" style="width:180px">
            </div>
            <div class="col-auto" id="bgWrap">
              <label class="form-label small fw-semibold mb-1">透明区填充</label>
              <input type="color" class="form-control form-control-color" id="bgColor" value="#ffffff" title="透明区填充色">
            </div>
            <div class="col-auto d-none" id="icoSizesWrap">
              <label class="form-label small fw-semibold mb-1">ICO 包含尺寸</label>
              <div class="d-flex gap-2" id="icoSizes">
                <div class="form-check"><input class="form-check-input" type="radio" name="icoSize" value="16" id="ico16"><label class="form-check-label small" for="ico16">16</label></div>
                <div class="form-check"><input class="form-check-input" type="radio" name="icoSize" value="32" id="ico32"><label class="form-check-label small" for="ico32">32</label></div>
                <div class="form-check"><input class="form-check-input" type="radio" name="icoSize" value="48" id="ico48"><label class="form-check-label small" for="ico48">48</label></div>
                <div class="form-check"><input class="form-check-input" type="radio" name="icoSize" value="64" id="ico64"><label class="form-check-label small" for="ico64">64</label></div>
                <div class="form-check"><input class="form-check-input" type="radio" name="icoSize" value="128" id="ico128"><label class="form-check-label small" for="ico128">128</label></div>
                <div class="form-check"><input class="form-check-input" type="radio" name="icoSize" value="256" id="ico256" checked><label class="form-check-label small" for="ico256">256</label></div>
              </div>
            </div>
            <div class="col-auto ms-auto">
              <button class="btn btn-outline-danger" id="clearBtn"><i class="bi bi-trash me-1"></i>清空列表</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 文件列表 -->
    <div class="col-12">
      <div id="fileList" class="d-flex flex-column gap-3"></div>
      <div class="text-secondary text-center py-5 d-none" id="emptyTip">
        <i class="bi bi-images fs-1 d-block mb-2"></i>尚未添加图片
      </div>
      <div class="d-none mt-3" id="downloadAllWrap">
        <button class="btn btn-primary px-4" id="downloadAllBtn"><i class="bi bi-download me-1"></i>逐个下载全部</button>
      </div>
    </div>
  </div>
{% endblock %}

{% block extra_js %}
  <script>
    (function () {
      var items = [];   // {id, file, img, blob, outName, error}
      var uid = 0;

      var dropZone = document.getElementById('dropZone');
      var fileInput = document.getElementById('fileInput');
      var list = document.getElementById('fileList');
      var fmtSel = document.getElementById('fmtSelect');
      var qualityRange = document.getElementById('qualityRange');
      var qualityVal = document.getElementById('qualityVal');
      var bgColor = document.getElementById('bgColor');

      function fmtBytes(n) {
        if (!n) { return '0 B'; }
        var u = ['B', 'KB', 'MB', 'GB'], i = 0;
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
        return n.toFixed(i ? 2 : 0) + ' ' + u[i];
      }
      function ext() { return fmtSel.value === 'jpeg' ? 'jpg' : fmtSel.value; }

      // ---------- 设置联动 ----------
      function syncOpts() {
        var f = fmtSel.value;
        document.getElementById('qualityWrap').classList.toggle('d-none', !(f === 'jpeg' || f === 'webp'));
        document.getElementById('bgWrap').classList.toggle('d-none', f === 'png' || f === 'ico');
        document.getElementById('icoSizesWrap').classList.toggle('d-none', f !== 'ico');
      }
      fmtSel.addEventListener('change', function () { syncOpts(); reconvertAll(); });
      qualityRange.addEventListener('input', function () { qualityVal.textContent = qualityRange.value + '%'; });
      qualityRange.addEventListener('change', reconvertAll);
      bgColor.addEventListener('change', reconvertAll);
      document.getElementById('icoSizes').addEventListener('change', reconvertAll);

      // ---------- 添加文件 ----------
      dropZone.addEventListener('click', function () { fileInput.click(); });
      dropZone.addEventListener('dragover', function (e) { e.preventDefault(); dropZone.style.opacity = '.7'; });
      dropZone.addEventListener('dragleave', function () { dropZone.style.opacity = ''; });
      dropZone.addEventListener('drop', function (e) {
        e.preventDefault(); dropZone.style.opacity = '';
        addFiles(e.dataTransfer.files);
      });
      fileInput.addEventListener('change', function () { addFiles(fileInput.files); fileInput.value = ''; });

      function addFiles(files) {
        Array.prototype.forEach.call(files, function (f) {
          if (!/^image\//.test(f.type)) { return; }
          var item = { id: ++uid, file: f, img: null, blob: null, outName: '', error: '' };
          items.push(item);
          render();
          var img = new Image();
          img.onload = function () {
            item.img = img;
            convert(item);
          };
          img.onerror = function () {
            item.error = '无法解码该图片';
            render();
          };
          img.src = URL.createObjectURL(f);
        });
      }

      // ---------- 转换核心 ----------
      function drawTo(img, size) {
        var cv = document.createElement('canvas');
        cv.width = size || img.naturalWidth;
        cv.height = size || img.naturalHeight;
        var ctx = cv.getContext('2d');
        if (fmtSel.value !== 'png' && fmtSel.value !== 'ico') {
          ctx.fillStyle = bgColor.value;   // 非透明格式先铺底色
          ctx.fillRect(0, 0, cv.width, cv.height);
        }
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        return cv;
      }

      function canvasBlob(cv, mime, q) {
        return new Promise(function (res, rej) {
          cv.toBlob(function (b) { b ? res(b) : rej(new Error('该格式编码失败')); }, mime, q);
        });
      }

      // BMP = 手写编码器（浏览器 toBlob 不支持 image/bmp）：24 位、行底对齐 4 字节
      function encodeBmp(img) {
        var cv = drawTo(img);
        var w = cv.width, h = cv.height;
        var data = cv.getContext('2d').getImageData(0, 0, w, h).data;
        var rowSize = Math.floor((24 * w + 31) / 32) * 4;
        var pixSize = rowSize * h;
        var fileSize = 54 + pixSize;
        var u8 = new Uint8Array(fileSize);
        var dv = new DataView(u8.buffer);
        u8[0] = 0x42; u8[1] = 0x4D;                       // 'BM'
        dv.setUint32(2, fileSize, true);
        dv.setUint32(10, 54, true);                        // 像素数据偏移
        dv.setUint32(14, 40, true);                        // BITMAPINFOHEADER 大小
        dv.setInt32(18, w, true);
        dv.setInt32(22, h, true);                          // 正数 = 自底向上
        dv.setUint16(26, 1, true);                         // planes
        dv.setUint16(28, 24, true);                        // bpp
        dv.setUint32(34, pixSize, true);
        dv.setInt32(38, 2835, true); dv.setInt32(42, 2835, true); // 72 dpi
        for (var y = 0; y < h; y++) {
          var src = (h - 1 - y) * w * 4, dst = 54 + y * rowSize;
          for (var x = 0; x < w; x++) {
            var s = src + x * 4;
            u8[dst + x * 3] = data[s + 2];                 // B
            u8[dst + x * 3 + 1] = data[s + 1];             // G
            u8[dst + x * 3 + 2] = data[s];                 // R
          }
        }
        return new Blob([u8], { type: 'image/bmp' });
      }

      // ICO = 单尺寸 PNG 条目容器
      function buildIco(img) {
        var checked = document.querySelector('#icoSizes input:checked');
        var px = checked ? +checked.value : 256;
        return canvasBlob(drawTo(img, px), 'image/png').then(function (b) {
          return b.arrayBuffer();
        }).then(function (buf) {
          var off = 6 + 16;
          var out = new Uint8Array(off + buf.byteLength);
          var dv = new DataView(out.buffer);
          dv.setUint16(0, 0, true); dv.setUint16(2, 1, true); dv.setUint16(4, 1, true);
          out[6] = px >= 256 ? 0 : px;       // 0 表示 256
          out[7] = px >= 256 ? 0 : px;
          dv.setUint16(10, 1, true);          // planes
          dv.setUint16(12, 32, true);         // bpp
          dv.setUint32(14, buf.byteLength, true);
          dv.setUint32(18, off, true);
          out.set(new Uint8Array(buf), off);
          return new Blob([out], { type: 'image/x-icon' });
        });
      }

      function convert(item) {
        if (!item.img) { return; }
        var f = fmtSel.value, q = +qualityRange.value / 100;
        var p;
        if (f === 'ico') {
          p = buildIco(item.img);
        } else if (f === 'bmp') {
          p = Promise.resolve(encodeBmp(item.img));
        } else {
          p = canvasBlob(drawTo(item.img), 'image/' + f, q);
        }
        p.then(function (blob) {
          item.blob = blob;
          item.error = '';
          item.outName = item.file.name.replace(/\.[^.]+$/, '') + '.' + ext();
          render();
        }).catch(function (exc) {
          item.blob = null;
          item.error = exc.message;
          render();
        });
      }
      function reconvertAll() { items.forEach(convert); }

      // ---------- 渲染 ----------
      function render() {
        document.getElementById('emptyTip').classList.toggle('d-none', items.length > 0);
        var anyDone = items.some(function (i) { return i.blob; });
        document.getElementById('downloadAllWrap').classList.toggle('d-none', !anyDone);
        list.innerHTML = items.map(function (i) {
          var thumb = i.img ? '<img src="' + i.img.src + '" style="width:64px;height:64px;object-fit:contain;border-radius:6px;background:#f1f3f5">' : '';
          var conv = '';
          if (i.blob) {
            var ratio = i.blob.size / i.file.size * 100;
            conv = '<span class="text-secondary">' + fmtBytes(i.file.size) + ' →</span> <code>' + fmtBytes(i.blob.size) + '</code> ' +
              '<span class="badge ' + (ratio <= 100 ? 'bg-success' : 'bg-warning text-dark') + '">' + ratio.toFixed(0) + '%</span>';
          } else if (i.error) {
            conv = '<span class="text-danger small">' + i.error + '</span>';
          } else {
            conv = '<span class="text-secondary small">转换中…</span>';
          }
          var dl = i.blob
            ? '<a class="btn btn-sm btn-outline-primary" download="' + i.outName + '" href="' + URL.createObjectURL(i.blob) + '"><i class="bi bi-download"></i> 下载 ' + ext().toUpperCase() + '</a>'
            : '';
          return '<div class="card stat-card mb-0"><div class="card-body d-flex align-items-center gap-3 py-2 flex-wrap">' +
            thumb +
            '<div class="flex-grow-1" style="min-width:180px"><div class="fw-semibold text-truncate" style="max-width:360px">' + i.file.name + '</div>' +
            '<div class="small">' + conv + '</div></div>' +
            '<div class="d-flex gap-2">' + dl +
            '<button class="btn btn-sm btn-outline-danger" data-del="' + i.id + '" title="移除"><i class="bi bi-x"></i></button>' +
            '</div></div></div>';
        }).join('');
        list.querySelectorAll('button[data-del]').forEach(function (b) {
          b.addEventListener('click', function () {
            items = items.filter(function (i) { return i.id !== +b.dataset.del; });
            render();
          });
        });
      }

      document.getElementById('clearBtn').addEventListener('click', function () {
        items = []; render();
      });
      document.getElementById('downloadAllBtn').addEventListener('click', function () {
        // 逐个触发下载，间隔避免浏览器拦截
        var links = Array.prototype.slice.call(list.querySelectorAll('a[download]'));
        links.forEach(function (a, idx) {
          setTimeout(function () { a.click(); }, idx * 300);
        });
      });

      syncOpts();
    })();
  </script>
{% endblock %}
